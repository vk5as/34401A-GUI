name: CI

on:
  # Every push to every branch, and every pull request (spec story 101).
  push:
    branches: ["**"]
  pull_request: {}

permissions:
  contents: read

# A newer push to the same ref supersedes the run still going for the older one. Pull requests get their own ref
# (refs/pull/N/merge), so a branch push and its pull request do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Black
        run: black --check src tests scripts
      - name: Ruff
        run: ruff check src tests scripts
      - name: mypy
        run: mypy
      - name: Bandit
        run: bandit -c pyproject.toml -r src
      - name: pip-audit
        run: pip-audit .

  test-linux:
    name: Tests, Linux, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: xvfb-run -a pytest
      - name: GUI smoke test
        run: xvfb-run -a python scripts/ci_smoke_test.py
      - name: Coverage gate (GUI excluded)
        run: coverage report --omit="*/agilent34401a/gui/*" --fail-under=85

  test-windows:
    name: Tests, Windows, Python 3.14
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: GUI smoke test
        run: python scripts/ci_smoke_test.py
      - name: Coverage gate (GUI excluded)
        run: coverage report --omit="*/agilent34401a/gui/*" --fail-under=85

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Check wheel contents
        run: check-wheel-contents dist/*.whl
