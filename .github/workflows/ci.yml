name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Black
        run: black --check src tests
      - name: Ruff
        run: ruff check src tests
      - name: mypy
        run: mypy
      - name: Bandit
        run: bandit -c pyproject.toml -r src
      - name: pip-audit
        run: pip-audit .

  test-linux:
    name: Tests, Linux, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: xvfb-run -a pytest
      - name: Coverage gate (GUI excluded)
        run: coverage report --omit="*/agilent34401a/gui/*" --fail-under=85

  test-windows:
    name: Tests, Windows, Python 3.13
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: Coverage gate (GUI excluded)
        run: coverage report --omit="*/agilent34401a/gui/*" --fail-under=85

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Check wheel contents
        run: check-wheel-contents dist/*.whl
