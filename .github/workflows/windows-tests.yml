# Run chosen tests on Windows on demand, to diagnose something only Windows does, in a couple of minutes instead of a
# full CI run. Actions tab -> "Windows tests" -> Run workflow, pick the branch, and give pytest arguments, for example
# `tests/test_gui_app.py -k shortcut`.
name: Windows tests

on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: "Arguments for pytest (test paths, -k expressions, -x ...)"
        required: true
        default: "tests/test_gui_app.py -x"
      python_version:
        description: "Python version"
        required: true
        default: "3.14"

permissions:
  contents: read

jobs:
  windows:
    name: Windows, Python ${{ inputs.python_version }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        shell: bash
        env:
          # Passed through the environment, not pasted into the script, so the input cannot inject shell commands.
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: |
          read -ra args <<< "$PYTEST_ARGS"
          python -m pytest -v --no-cov -p no:cacheprovider "${args[@]}"
