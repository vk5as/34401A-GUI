[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agilent34401a"
version = "0.1.0"
description = "Tkinter GUI and CLI for remote-controlling an Agilent/HP 34401A digital multimeter over GPIB or RS-232"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "VK5AS", email = "vk5as.com@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.8",
    "pyserial>=3.5",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
]

[project.optional-dependencies]
# GPIB through pyvisa-py on Linux (linux-gpib) or via an NI-488.2 compatible DLL on Windows.
gpib = [
    "gpib-ctypes>=0.4",
]
# ruff (select = ALL) and black change behaviour between releases, so their versions are capped.
dev = [
    "bandit[toml]>=1.7",
    "black>=26,<27",
    "build>=1.2",
    "check-wheel-contents>=0.6",
    "mypy>=2,<3",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16,<0.17",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/vk5as/34401A-GUI"
Repository = "https://github.com/vk5as/34401A-GUI"
Issues = "https://github.com/vk5as/34401A-GUI/issues"

[project.scripts]
agilent34401a-gui = "agilent34401a.gui.app:main"
agilent34401a-cli = "agilent34401a.cli:main"
agilent34401a-sim = "agilent34401a.sim_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agilent34401a = ["py.typed"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicts with Black's formatting.
    "COM812",
    "ISC001",
    # Mutually exclusive pairs; the other member of each is enforced.
    "D203",
    "D213",
    # Docstrings are required on modules and public classes only (ADR-0007), not on every function.
    "D102",
    "D103",
    "D105",
    "D107",
    # The LICENSE file carries the copyright notice; a header in every file adds nothing.
    "CPY001",
    # Line length is Black's job; E501 would disagree with it on strings Black deliberately leaves long.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",     # test functions are not required to be annotated
    "D",       # no docstrings in tests
    "FBT",     # boolean parameters are fine in parametrised tests
    "PLR2004", # magic values are the point of assertions
    "S101",    # assert is how pytest tests are written
    "SLF001",  # tests may exercise private helpers
]

"scripts/**" = [
    "INP001", # standalone scripts run directly, they are not a package
]

[tool.ruff.lint.isort]
known-first-party = ["agilent34401a"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# Test functions are still type-checked, just not required to be annotated.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["agilent34401a"]
branch = true

[tool.coverage.report]
# The 85% gate excludes the GUI package (ADR-0007); see the README for the gate command.
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
